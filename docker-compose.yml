services:
  # ============================================
  # 1. NGINX LOAD BALANCER
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    restart: on-failure

  # ============================================
  # 2. MYSQL
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: e_bank_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fifa2014}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-e_bank}
      MYSQL_USER: ${MYSQL_USER:-amine}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fifa2014}
    ports:
      - "3307:3306"  # 🔥 Port 3307 sur l'hôte vers 3306 dans le conteneur
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: on-failure

  # ============================================
  # 3. 10 INSTANCES DU BACKEND (ports uniques)
  # ============================================
  app1:
    build: ./backend
    container_name: e_bank_app1
    image: digital-banking-backend:latest
    ports:
      - "8081:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/e_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-fifa2014}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

