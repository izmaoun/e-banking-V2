  frontend:
    build: ./frontend
    container_name: e_bank_frontend
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - ANGULAR_API_URL=${ANGULAR_API_URL:-http://localhost:80}
    networks:
